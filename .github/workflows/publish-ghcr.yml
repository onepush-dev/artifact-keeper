name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "proxy/**", "web/**", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ghcr.io/onepush-dev/artifact-keeper-backend:1.12.4 backend
          docker build -t ghcr.io/onepush-dev/artifact-keeper-proxy:1.12.4 proxy
          docker build -t ghcr.io/onepush-dev/artifact-keeper-web:1.12.1 web
          docker push ghcr.io/onepush-dev/artifact-keeper-backend:1.12.4
          docker push ghcr.io/onepush-dev/artifact-keeper-proxy:1.12.4
          docker push ghcr.io/onepush-dev/artifact-keeper-web:1.12.1
